<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pembuat Playlist Spotify</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🎵</div>
      <h1>Pembuat Playlist</h1>
      <p class="subtitle">Bikin playlist Spotify langsung dari browser.</p>
    </header>

    <!-- Login state -->
    <section id="login-view" class="card hidden">
      <p>Hubungkan akun Spotify kamu untuk mulai.</p>
      <a href="/login" class="btn btn-primary">Masuk dengan Spotify</a>
    </section>

    <!-- Main app -->
    <section id="app-view" class="hidden">
      <div class="userbar">
        <span>Masuk sebagai <strong id="user-name"></strong></span>
        <a href="/logout" class="link">Keluar</a>
      </div>

      <form id="playlist-form" class="card">
        <label>
          Nama playlist <span class="req">*</span>
          <input type="text" id="name" placeholder="Mix Keren Aku" required />
        </label>

        <label>
          Deskripsi
          <input type="text" id="description" placeholder="Opsional" />
        </label>

        <label class="checkbox">
          <input type="checkbox" id="public" />
          Jadikan playlist ini publik
        </label>

        <hr />

        <h3>Tambah lagu</h3>
        <label>
          Satu lagu per baris — pakai format <code>Judul - Artis</code> biar hasilnya paling akurat
          <textarea id="songs" rows="8"
            placeholder="Bohemian Rhapsody - Queen&#10;Hati-Hati di Jalan - Tulus&#10;Melukis Senja - Budi Doremi&#10;Monokrom - Tulus"></textarea>
        </label>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          Buat playlist
        </button>
      </form>

      <div id="result" class="card result hidden"></div>
    </section>

    <footer>
      <p class="muted">Kredensial kamu aman &amp; tidak disimpan di server.</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
