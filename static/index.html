<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Playlist Creator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🎵</div>
      <h1>Playlist Creator</h1>
      <p class="subtitle">Build a Spotify playlist from your browser.</p>
    </header>

    <!-- Login state -->
    <section id="login-view" class="card hidden">
      <p>Connect your Spotify account to get started.</p>
      <a href="/login" class="btn btn-primary">Log in with Spotify</a>
    </section>

    <!-- Main app -->
    <section id="app-view" class="hidden">
      <div class="userbar">
        <span>Logged in as <strong id="user-name"></strong></span>
        <a href="/logout" class="link">Log out</a>
      </div>

      <form id="playlist-form" class="card">
        <label>
          Playlist name <span class="req">*</span>
          <input type="text" id="name" placeholder="My Awesome Mix" required />
        </label>

        <label>
          Description
          <input type="text" id="description" placeholder="Optional" />
        </label>

        <label class="checkbox">
          <input type="checkbox" id="public" />
          Make this playlist public
        </label>

        <hr />

        <h3>Add songs</h3>
        <label>
          One song per line — use <code>Title - Artist</code> for best results
          <textarea id="songs" rows="6"
            placeholder="Bohemian Rhapsody - Queen&#10;Africa - Toto&#10;Mr. Brightside - The Killers"></textarea>
        </label>

        <hr />

        <h3>Or let Spotify recommend <span class="muted">(max 5 seeds total)</span></h3>
        <div class="grid">
          <label>
            Seed artists <span class="muted">(comma-separated)</span>
            <input type="text" id="seed_artists" placeholder="Bon Iver, Tulus" />
          </label>
          <label>
            Seed genres <span class="muted">(comma-separated)</span>
            <input type="text" id="seed_genres" placeholder="acoustic, pop" />
          </label>
          <label>
            Seed tracks <span class="muted">(comma-separated)</span>
            <input type="text" id="seed_tracks" placeholder="Holocene" />
          </label>
          <label>
            How many to add
            <input type="number" id="count" value="20" min="1" max="100" />
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          Create playlist
        </button>
      </form>

      <div id="result" class="card result hidden"></div>
    </section>

    <footer>
      <p class="muted">Runs locally · your credentials stay on your machine.</p>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
